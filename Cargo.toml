[package]
name = "blocklog-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Blocklog MCP server for authorized, auditable agent actions"
authors = ["Blocklog Authors and Contributors <dev@blocklogsecurity.com>"]
repository = "https://github.com/blockloglabs/blocklog-mcp"
homepage = "https://blocklogsecurity.com"
readme = "README.md"
keywords = ["mcp", "model-context-protocol", "security", "ai-agents", "audit-ledger"]
categories = ["command-line-utilities", "cryptography", "development-tools"]

[dependencies]
rmcp = { version = "3.8.0", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.8"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["chrono04"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
unicode-normalization = "0.1"
tower-http = { version = "0.6", features = ["limit", "trace"] }

[dev-dependencies]
tokio = { version = "1.52", features = ["full"] }
